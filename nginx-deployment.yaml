apiVersion: v1
kind: Namespace
metadata:
  name: nginx-deployment

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      initContainers:
      - name: init-nginx-content
        image: registry.access.redhat.com/ubi8/nginx-124:latest
        command:
          - /bin/sh
          - -c
          - |
            mkdir -p /opt/app-root/src
            echo '<html><body><h1>Nginx from registry.access.redhat.com/ubi8/nginx-124</h1><p>Successfully deployed on AKS!</p></body></html>' > /opt/app-root/src/index.html
        volumeMounts:
        - name: nginx-content
          mountPath: /opt/app-root/src
      containers:
      - name: nginx
        image: registry.access.redhat.com/ubi8/nginx-124:latest
        imagePullPolicy: Always
        command:
          - /usr/bin/bash
          - -c
          - |
            /usr/sbin/nginx -g "daemon off;"
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: NGINX_DEFAULT_CONF
          value: "true"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        volumeMounts:
        - name: nginx-content
          mountPath: /opt/app-root/src
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: nginx-content
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: nginx-deployment
  labels:
    app: nginx
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: nginx
